# ──────────────────────────────────────────────────────────────────────────────
# Mullion — Release workflow
#
# Triggered manually via workflow_dispatch.  Inputs:
#   version     – "auto" to compute from conventional commits, or explicit "X.Y.Z"
#   deploy_svn  – check to also push to WordPress.org SVN (requires secrets)
#
# Flow:
#   1. Compute or validate version
#   2. Bump version in package.json + plugin header + MULLION_VERSION constant
#   3. Run tests (sanity gate)
#   4. Production build (build:wp) — premium JS
#   5. Install production-only Composer deps
#   6. Package premium ZIP (mullion-gallery-v*.zip)
#   7. Rebuild free/lite assets (build:wp:free) — OVERWRITES plugin assets/
#      Must stay AFTER step 6. WordPress.org guideline 5 forbids locked/premium
#      code in the directory; Freemius does not SVN-publish for us
#      (https://freemius.com/help/documentation/wordpress/deployment-process/).
#   8. Static Pro-code scan + package lite ZIP (mullion-gallery-lite-v*.zip)
#   9. Commit version bump → create git tag → push
#  10. Create GitHub Release with BOTH ZIPs attached
#  11. (Optional) Deploy to WordPress.org SVN from the lite working tree
# ──────────────────────────────────────────────────────────────────────────────

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (leave "auto" to compute from commits)'
        required: true
        default: 'auto'
        type: string
      deploy_svn:
        description: 'Deploy to WordPress.org SVN'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # ── Checkout with full history (needed for tag detection + commit scan) ──
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── Setup toolchains ────────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl
          tools: composer:v2

      # ── Compute version ─────────────────────────────────────────────────────
      - name: Determine version
        id: version
        run: |
          INPUT_VERSION="${{ inputs.version }}"
          if [ "$INPUT_VERSION" = "auto" ]; then
            NEXT=$(bash scripts/compute-version.sh)
            echo "Computed version from commits: $NEXT"
          else
            NEXT="$INPUT_VERSION"
            echo "Using explicit version: $NEXT"
          fi

          # Validate format.
          if ! echo "$NEXT" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version format: $NEXT (expected X.Y.Z)"
            exit 1
          fi

          # Check tag doesn't already exist.
          if git rev-parse "v$NEXT" >/dev/null 2>&1; then
            echo "::error::Tag v$NEXT already exists"
            exit 1
          fi

          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEXT" >> "$GITHUB_OUTPUT"

      # ── Bump version in source files ────────────────────────────────────────
      - name: Bump version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          PLUGIN_FILE="wp-plugin/mullion-gallery/mullion-gallery.php"

          # 1. package.json
          npm version "$VERSION" --no-git-tag-version

          # 2. Plugin header: "Version: X.Y.Z"
          sed -i "s/^ \* Version: .*/ * Version:           $VERSION/" "$PLUGIN_FILE"

          # 3. MULLION_VERSION constant
          sed -i "s/define('MULLION_VERSION', '.*')/define('MULLION_VERSION', '$VERSION')/" "$PLUGIN_FILE"

          # 4. readme.txt stable tag
          sed -i "s/^Stable tag: .*/Stable tag: $VERSION/" wp-plugin/mullion-gallery/readme.txt

          echo "Bumped to $VERSION"
          grep -n "Version:" "$PLUGIN_FILE" | head -1
          grep -n "MULLION_VERSION" "$PLUGIN_FILE" | head -1
          grep "version" package.json | head -1

      # ── Install & test ──────────────────────────────────────────────────────
      - run: npm ci

      - name: Vitest (sanity gate)
        run: npm run test:coverage

      - name: Build production assets
        run: npm run build:wp

      # ── PHPUnit sanity gate ─────────────────────────────────────────────────
      - name: Install Composer dependencies (dev)
        working-directory: wp-plugin/mullion-gallery
        run: composer install --prefer-dist --no-interaction

      - name: Start wp-env
        run: npx wp-env start

      - name: PHPUnit (sanity gate)
        run: |
          npx wp-env run tests-cli sh -c \
            "cd /var/www/html/wp-content/plugins/mullion-gallery && ./vendor/bin/phpunit -c phpunit.xml.dist"

      - name: Stop wp-env
        if: always()
        run: npx wp-env stop

      # ── Production Composer deps ────────────────────────────────────────────
      - name: Install production PHP deps
        working-directory: wp-plugin/mullion-gallery
        run: |
          composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      # ── Create premium distribution ZIP ─────────────────────────────────────
      # Capture premium assets as ZIP bytes BEFORE the free rebuild below
      # overwrites wp-plugin/mullion-gallery/assets/. Do not reorder.
      - name: Package premium distribution ZIP
        id: zip
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ZIP_NAME="mullion-gallery-v${VERSION}.zip"

          cd wp-plugin
          zip -r "../${ZIP_NAME}" mullion-gallery \
            -x "mullion-gallery/tests/*" \
            -x "mullion-gallery/phpunit/*" \
            -x "mullion-gallery/phpunit.xml.dist" \
            -x "mullion-gallery/phpcs.xml" \
            -x "mullion-gallery/.phpunit.result.cache" \
            -x "mullion-gallery/composer.json" \
            -x "mullion-gallery/composer.lock" \
            -x "mullion-gallery/.wp-env.json" \
            -x "mullion-gallery/bin/*"
          cd ..

          echo "zip_path=${ZIP_NAME}" >> "$GITHUB_OUTPUT"
          echo "Created $ZIP_NAME ($(du -h "$ZIP_NAME" | cut -f1))"

      # ── Free / lite channel (P75-B) ─────────────────────────────────────────
      # build:wp:free sets MULLION_PREMIUM=false, DCE-strips Pro authoring from
      # the JS bundle, and rewrites assets/mullion-edition.json to premium:false.
      # PHP is byte-identical across editions (license enforcement, not feature
      # code), so Composer --no-dev from above is reused.
      #
      # ORDERING: this MUST run after the premium ZIP step. Both editions share
      # wp-plugin/mullion-gallery/assets/; the free build destroys the premium
      # assets the ZIP already captured. Moving this before the premium zip
      # would ship a stripped "premium" artifact.
      - name: Build free (lite) assets
        run: npm run build:wp:free

      - name: Verify free (lite) assets are Pro-code clean
        run: |
          # Recurses; hashed chunks live in assets/assets/ (copy of dist/).
          node scripts/check-free-build-clean.mjs wp-plugin/mullion-gallery/assets
          node -e '
            const fs = require("fs");
            const p = "wp-plugin/mullion-gallery/assets/mullion-edition.json";
            let data;
            try { data = JSON.parse(fs.readFileSync(p, "utf8")); }
            catch (e) {
              console.error("FAIL — missing or malformed edition marker at", p);
              process.exit(1);
            }
            if (data.premium !== false) {
              console.error("FAIL — lite package marker is not { premium: false }:", data);
              process.exit(1);
            }
            console.log("Edition marker is free (premium: false)");
          '

      - name: Package lite distribution ZIP
        id: zip_lite
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ZIP_NAME="mullion-gallery-lite-v${VERSION}.zip"

          # Same exclude list as the premium ZIP (canonical: .distignore).
          # Internal folder is still mullion-gallery/; only the filename
          # carries -lite- (Phase 74 Decision C / P75 Key Decision F).
          cd wp-plugin
          zip -r "../${ZIP_NAME}" mullion-gallery \
            -x "mullion-gallery/tests/*" \
            -x "mullion-gallery/phpunit/*" \
            -x "mullion-gallery/phpunit.xml.dist" \
            -x "mullion-gallery/phpcs.xml" \
            -x "mullion-gallery/.phpunit.result.cache" \
            -x "mullion-gallery/composer.json" \
            -x "mullion-gallery/composer.lock" \
            -x "mullion-gallery/.wp-env.json" \
            -x "mullion-gallery/bin/*"
          cd ..

          echo "zip_path=${ZIP_NAME}" >> "$GITHUB_OUTPUT"
          echo "Created $ZIP_NAME ($(du -h "$ZIP_NAME" | cut -f1))"

      # ── Commit, tag, push ───────────────────────────────────────────────────
      - name: Commit version bump and create tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage only the files touched by the version bump step.
          # (The ZIP is left intact for the GitHub Release upload step.)
          git add package.json package-lock.json \
            wp-plugin/mullion-gallery/mullion-gallery.php \
            wp-plugin/mullion-gallery/readme.txt
          git commit -m "chore(release): ${TAG}" --no-verify
          git tag -a "$TAG" -m "Release ${TAG}"
          git push origin HEAD --follow-tags

      # ── Create GitHub Release ───────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            ${{ steps.zip.outputs.zip_path }}
            ${{ steps.zip_lite.outputs.zip_path }}

      # ── Upload ZIPs as workflow artifacts (backup) ──────────────────────────
      - name: Upload premium release ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-zip
          path: ${{ steps.zip.outputs.zip_path }}
          retention-days: 90

      - name: Upload lite release ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-zip-lite
          path: ${{ steps.zip_lite.outputs.zip_path }}
          retention-days: 90

      # ── Optional: Deploy lite build to WordPress.org SVN ────────────────────
      # BUILD_DIR is the working tree AFTER build:wp:free overwrote assets/.
      # Do not move this before the free build — that would push Pro code to
      # WordPress.org (guideline 5). Dedicated SVN Deploy workflow downloads
      # the lite ZIP from the GitHub Release instead (exact released bytes).
      - name: Deploy to WordPress.org SVN
        if: ${{ inputs.deploy_svn }}
        uses: 10up/action-wordpress-plugin-deploy@v2
        with:
          generate-zip: false
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: mullion-gallery
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_DIR: wp-plugin/mullion-gallery
